# Render Blueprint — deploys the Finesse multiplayer API as a single FREE
# Docker web service, with Redis colocated inside the container (see
# apps/api/Dockerfile + apps/api/docker-entrypoint.sh). No separate Redis service.
#
# The four `sync: false` vars below are NOT stored here (they are secret or
# instance-specific) — set them once in the Render dashboard after the first
# deploy. Full step-by-step: project-docs/deploy-render.md
#
# PORT is intentionally NOT set: Render injects its own PORT and the server
# binds process.env.PORT (apps/api/src/index.ts).
services:
  - type: web
    # NOTE: renaming this service makes the next Blueprint sync create a NEW
    # service — Render matches by name — leaving `gameexplorer-api` behind for
    # manual deletion. Every dashboard-set var below (CORS_ORIGIN, Supabase
    # keys) must be re-entered on the new service, and the web + mobile clients
    # repointed at its URL. Revert to `gameexplorer-api` to skip that migration.
    name: finesse-api
    runtime: docker
    # Still GameExplorer: this must match the real remote, so change it only
    # when the GitHub repository itself is renamed.
    repo: https://github.com/aokhader/GameExplorer
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Colocated Redis inside the container.
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      # ── Set these in the dashboard (Environment tab) ──
      # Your Vercel web app origin, e.g. https://finesse.vercel.app
      - key: CORS_ORIGIN
        sync: false
      # Supabase project URL, e.g. https://anygsfoltjxhklnpxpiu.supabase.co
      - key: SUPABASE_URL
        sync: false
      # Supabase SECRET key (sb_secret_...) — server-side persistence, bypasses RLS.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Supabase Postgres SESSION POOLER connection string (Dashboard → Connect).
      # Leave `sslmode` OUT of it — TLS is configured in src/config/database.ts,
      # and a sslmode in the URL overrides that config (pg merges the URL last).
      - key: DATABASE_URL
        sync: false
      # Supabase's CA certificate (PEM) — Project Settings → Database → SSL
      # Configuration → Download certificate. Without it the Postgres connection
      # is encrypted but the server cert is not verified.
      - key: DATABASE_CA_CERT
        sync: false
