name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-progress run for the same branch/PR so rapid pushes don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type-check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prisma generate creates the @prisma/client TypeScript types from the
      # schema. The generated files are gitignored so this must run in CI.
      # DATABASE_URL is not used by `prisma generate` itself (no db connection
      # is made), but prisma.config.ts imports it so we provide a dummy value.
      - name: Generate Prisma client
        run: pnpm --filter @gameexplorer/api exec prisma generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      # Turbo's typecheck task has `dependsOn: ["^build"]`, so it automatically
      # builds packages/shared and packages/db first before type-checking apps/web
      # and apps/api. No explicit build step required here.
      - name: Type-check
        run: pnpm typecheck

      # Only apps/web has a lint script today; Turbo skips packages without one.
      - name: Lint
        run: pnpm lint

      # Engine unit tests (packages/shared, Vitest) + API service tests +
      # API WebSocket E2E tests (apps/api, Vitest — real Socket.io server with
      # in-memory Redis/Supabase fakes, so no service containers are needed) +
      # the packages/client import-boundary test (proves the shared client layer
      # stays free of next/* and DOM globals so the future RN app can reuse it).
      # Turbo skips packages without a test script.
      - name: Test
        run: pnpm test

  # Frontend E2E (Playwright). Builds and boots the real Next.js app, so it
  # needs the public Supabase env; configure NEXT_PUBLIC_SUPABASE_URL and
  # NEXT_PUBLIC_SUPABASE_ANON_KEY as repository *Variables* (they are public
  # values, not secrets) to enable this job — it is skipped otherwise.
  e2e-web:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    if: ${{ vars.NEXT_PUBLIC_SUPABASE_URL != '' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @gameexplorer/web exec playwright install --with-deps chromium

      # Turbo builds the workspace deps (shared/db/ui) first via ^build, then
      # playwright.config.ts builds + starts the Next.js app itself (CI mode).
      - name: Web E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'
